name: Publish to Chocolatey

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - helium.nuspec
      - tools/**

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Read the version from the nuspec
        id: pkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$nuspec = Get-Content -Raw helium.nuspec
          $version = $nuspec.package.metadata.version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "no <version> in helium.nuspec" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Verify the upstream installer URL and its checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.pkg.outputs.version }}'
          $installer = Get-Content -Raw tools/chocolateyinstall.ps1
          $expected = [regex]::Match($installer, "checksum64\s*=\s*'([0-9a-fA-F]{64})'").Groups[1].Value.ToLower()
          if ($expected -notmatch '^[0-9a-f]{64}$') { throw "no valid checksum64 found in tools/chocolateyinstall.ps1" }

          # Resolve the asset from the release itself instead of guessing its exact name/casing.
          $release = gh api "repos/imputnet/helium-windows/releases/tags/$version" | ConvertFrom-Json
          $asset = $release.assets |
            Where-Object { $_.name -like '*x64-installer.exe' -and $_.name -notlike '*mini*' } |
            Select-Object -First 1
          if (-not $asset) { throw "no x64 installer asset on the $version release" }

          $url = $asset.browser_download_url
          Write-Host "Downloading $url"
          $file = Join-Path $env:RUNNER_TEMP 'installer.exe'
          Invoke-WebRequest -Uri $url -OutFile $file -UseBasicParsing
          $actual = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "checksum mismatch for $version : package says $expected, upstream file hashes to $actual"
          }
          if ($asset.digest -and $asset.digest -ne "sha256:$actual") {
            throw "checksum mismatch against GitHub's own digest for $($asset.name): $($asset.digest)"
          }
          Write-Host "Upstream installer verified ($actual)"

      - name: choco pack
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco pack helium.nuspec --output-directory out
          $nupkg = (Get-ChildItem out -Filter *.nupkg | Select-Object -First 1).FullName
          if (-not $nupkg) { throw "choco pack produced no .nupkg" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "nupkg=$nupkg"
          Write-Host "Packed $nupkg"

      - name: Smoke test - install the packed package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.pkg.outputs.version }}'
          $source = (Resolve-Path out).Path
          choco install helium --version=$version --source="$source" --yes --no-progress --allow-unofficial
          if ($LASTEXITCODE -ne 0) { throw "choco install exited with $LASTEXITCODE" }

          $roots = @("$env:LOCALAPPDATA\imput\Helium", "$env:ProgramFiles\Helium") |
            Where-Object { Test-Path $_ }
          if (-not $roots) { throw "smoke test failed: no Helium install directory was created" }

          # what did we actually get on disk?
          Get-ChildItem -Path $roots -Recurse -Depth 1 -ErrorAction SilentlyContinue |
            Select-Object -First 30 | ForEach-Object { Write-Host "  $($_.FullName)" }

          $exe = Get-ChildItem -Path $roots -Recurse -ErrorAction SilentlyContinue -Include 'helium.exe', 'chrome.exe' |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw "smoke test failed: no browser executable found under $($roots -join ', ')" }
          Write-Host "Smoke test passed: $($exe.FullName) ($([math]::Round($exe.Length / 1MB)) MB)"

      - name: Push to community.chocolatey.org
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.pkg.outputs.version }}'

          if ([string]::IsNullOrWhiteSpace($env:CHOCO_API_KEY)) {
            Write-Warning "CHOCO_API_KEY is not set on this repository - skipping the push."
            exit 0
          }

          # Idempotence: never try to push a version that is already on the community feed.
          # NOTE: versions still in the moderation queue do not appear in the feed, so a
          # re-push of a queued version is expected - the duplicate error below is tolerated.
          $filter = "Id eq 'helium' and Version eq '$version'"
          $feed = "https://community.chocolatey.org/api/v2/Packages()?" + '$filter=' +
            [uri]::EscapeDataString($filter) + '&$select=Version&$top=1'
          try {
            $response = Invoke-WebRequest -Uri $feed -UseBasicParsing -TimeoutSec 60
            if ($response.Content -match "<entry") {
              Write-Host "helium $version is already published - nothing to do."
              exit 0
            }
          } catch {
            Write-Warning "could not query the community feed ($_), pushing anyway"
          }

          $pushOutput = & choco push '${{ steps.pack.outputs.nupkg }}' --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY --no-progress 2>&1
          $pushCode = $LASTEXITCODE
          $pushOutput | ForEach-Object { Write-Host $_ }
          if ($pushCode -ne 0) {
            if ($pushOutput -match 'already exists|Conflict|409') {
              Write-Host "helium $version already exists on the repository (most likely still in the moderation queue) - treating this as success."
              exit 0
            }
            throw "choco push failed with exit code $pushCode"
          }
          Write-Host "Pushed helium $version to the Chocolatey community repository."
